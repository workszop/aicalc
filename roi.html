<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<title data-t="roiPageTitle">Zwrot z inwestycji AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sub/sub.css">
</head>
<body class="edu" data-page="roi" data-state="loading">
<header class="edu-header"></header>

<main id="app" data-settings="closed">
  <button type="button" id="settingsBackdrop" tabindex="-1" data-t-aria="closeSettings" hidden></button>
  <aside id="settingsPanel" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle" data-t="settingsTitle"></h2>
      <button type="button" class="ghost-btn" id="settingsClose" data-t="settingsDone"></button>
    </div>
    <div class="settings-body">
      <section class="settings-group">
        <h3 class="group-title" data-t="groupCost"></h3>
        <div class="field"><label for="f-costMonthly" data-t="costMonthly"></label><input id="f-costMonthly" type="number" data-field="costMonthly"></div>
        <p class="hint" data-t="costHint"></p>
      </section>

      <section class="settings-group" data-accent="roi">
        <h3 class="group-title" data-t="groupBenefit"></h3>
        <div class="field"><label for="f-benefitMonthly" data-t="benefitMonthly"></label><input id="f-benefitMonthly" type="number" data-field="benefitMonthly" aria-describedby="benefitHelp"></div>
        <p class="hint" id="benefitHelp" data-t="benefitHelp"></p>
      </section>

      <section class="settings-group">
        <h3 class="group-title" data-t="groupRollout"></h3>
        <div>
          <div class="field"><label for="f-setup" data-t="setup"></label><input id="f-setup" type="number" data-field="setup"></div>
          <div class="field"><label for="f-training" data-t="training"></label><input id="f-training" type="number" data-field="training"></div>
          <div class="field"><label for="f-ramp" data-t="ramp"></label><input id="f-ramp" type="number" data-field="ramp"></div>
          <div class="field"><label for="f-horizon" data-t="horizon"></label><input id="f-horizon" type="number" data-field="horizon"></div>
        </div>
      </section>
    </div>
  </aside>

  <div id="resultsPanel" tabindex="-1">
    <div class="page-head">
      <h1 class="app-title" data-t="roiPageTitle"></h1>
      <p class="edu-lead" data-t="roiLead"></p>
    </div>
    <p class="invalid-note" data-t="invalidNote"></p>
    <section id="roiPanel" class="card"></section>
    <p class="hint" data-t="estimateNote"></p>
    <details class="panel" id="checksPanel" hidden></details>
    <footer class="shortcuts" data-t="shortcuts"></footer>
    <div class="sr-only" aria-live="polite" id="live"></div>
  </div>
</main>

<script src="sub/core.js"></script>
<script src="sub/ui.js"></script>
<script src="sub/roi.js"></script>
</body>
</html>
