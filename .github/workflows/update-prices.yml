name: update-prices

# Weekly model-price check against OpenRouter. Opens a PR, never pushes to the default branch.
# Needs the repo setting "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update prices (all changes except those flagged big)
        run: node scripts/update-prices.mjs --write > "$RUNNER_TEMP/price-update.md"

      - name: Show the report
        run: cat "$RUNNER_TEMP/price-update.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Run node tests
        run: |
          node tests/core.test.cjs
          node tests/scenario.test.cjs
          node tests/layout.test.cjs
          node tests/sub-core.test.cjs
          node tests/sub-sync.test.cjs
          node tests/prices.test.cjs
          node tests/update-prices.test.cjs

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No price changes to write; flagged and new models (if any) are in the job summary."
            exit 0
          fi
          branch="bot/price-update-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(prices): update model prices from OpenRouter"
          git push --force origin "$branch"
          if gh pr view "$branch" > /dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/price-update.md"
          else
            gh pr create --base "$BASE" --head "$branch" \
              --title "Ceny modeli z OpenRouter ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/price-update.md"
          fi
