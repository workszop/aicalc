name: update-prices

# Weekly model-price check against OpenRouter. Opens a PR, never pushes to the default branch.
# Needs the repo setting "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The update logic is tested against the built-in prices, so it runs before they change.
      - name: Test the update logic
        run: |
          node tests/prices.test.cjs
          node tests/update-prices.test.cjs

      - name: Update prices (all changes except those flagged big)
        run: node scripts/update-prices.mjs --write > "$RUNNER_TEMP/price-update.md"

      # Must pass after the write: index.html's CSV and sub/core.js agree.
      - name: Run consistency tests
        run: |
          node tests/sub-sync.test.cjs
          node tests/layout.test.cjs

      # Regression tests pin the built-in prices and the numbers they give (e.g. DeepSeek max output,
      # agent 487.64), so a real price change makes them fail. The result goes into the PR body;
      # the expectations are updated by hand when the PR is accepted.
      - name: Run regression tests (reported, not blocking)
        run: |
          {
            echo
            echo "## Testy regresji"
            echo
            echo "Te testy pilnują wbudowanych cen i wyników kalkulatorów, więc po zmianie cen część z nich może nie przechodzić."
            echo "Po zaakceptowaniu zmian zaktualizuj oczekiwane wartości w testach."
            echo "PR otwarty przez GitHub Actions nie uruchamia workflow \`tests\`: uruchom go ręcznie albo lokalnie."
            echo
            for t in core scenario sub-core; do
              if out=$(node "tests/$t.test.cjs" 2>&1); then
                echo "- \`tests/$t.test.cjs\`: przechodzi"
              else
                msg=$(printf '%s\n' "$out" | grep -m1 -E '^[A-Za-z]*Error( \[[A-Z_]+\])?:' | sed 's/^[[:space:]]*//' | cut -c1-200)
                echo "- \`tests/$t.test.cjs\`: nie przechodzi: $msg"
              fi
            done
          } >> "$RUNNER_TEMP/price-update.md"
          cat "$RUNNER_TEMP/price-update.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No price changes to write; flagged and new models (if any) are in the job summary."
            exit 0
          fi
          branch="bot/price-update-$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "chore(prices): update model prices from OpenRouter"
          git push --force origin "$branch"
          if gh pr view "$branch" > /dev/null 2>&1; then
            gh pr edit "$branch" --body-file "$RUNNER_TEMP/price-update.md"
          else
            gh pr create --base "$BASE" --head "$branch" \
              --title "Ceny modeli z OpenRouter ($(date -u +%F))" \
              --body-file "$RUNNER_TEMP/price-update.md"
          fi
