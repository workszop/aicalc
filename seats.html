<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<title data-t="seatsPageTitle">Subskrypcje vs API vs lokalnie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sub/sub.css">
</head>
<body class="edu" data-page="seats" data-state="loading">
<header class="edu-header"></header>

<main id="app" data-settings="closed">
  <button type="button" id="settingsBackdrop" tabindex="-1" data-t-aria="closeSettings" hidden></button>
  <aside id="settingsPanel" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle" data-t="settingsTitle"></h2>
      <button type="button" class="ghost-btn" id="settingsClose" data-t="settingsDone"></button>
    </div>
    <div class="settings-body">
      <section class="settings-group">
        <h3 class="group-title" data-t="groupTeam"></h3>
        <div class="field"><label for="f-users" data-t="users"></label><input id="f-users" type="number" data-field="users"></div>
        <div class="field"><label for="f-workDays" data-t="workDays"></label><input id="f-workDays" type="number" data-field="workDays" aria-describedby="h-workDays"></div>
        <p class="hint" id="h-workDays" data-t="hWorkDays"></p>
      </section>

      <section class="settings-group" data-accent="seats">
        <h3 class="group-title" data-t="groupPlan"></h3>
        <div class="field"><label for="f-plan" data-t="plan"></label><select id="f-plan" data-field="plan"></select></div>
        <p class="hint" id="planNote" hidden></p>
        <div id="customUsdField" hidden>
        <div class="field"><label for="f-customUsd" data-t="customUsd"></label><input id="f-customUsd" type="number" data-field="customUsd"></div>
        </div>
        <p class="hint" id="planChecked"></p>
      </section>

      <section class="settings-group">
        <h3 class="group-title" data-t="groupUsage"></h3>
        <div class="edu-seg" role="group" data-t-aria="presetsLabel" id="presets">
          <button type="button" data-preset="5" data-t="presetLight"></button>
          <button type="button" data-preset="15" data-t="presetMid"></button>
          <button type="button" data-preset="40" data-t="presetHeavy"></button>
        </div>
        <div class="field"><label for="f-chatsPerDay" data-t="chatsPerDay"></label><input id="f-chatsPerDay" type="number" data-field="chatsPerDay" aria-describedby="h-chatsPerDay"></div>
        <p class="hint" id="h-chatsPerDay" data-t="hChatsPerDay"></p>
        <div class="field"><label for="f-inTok" data-t="inTok"></label><input id="f-inTok" type="number" data-field="inTok" aria-describedby="h-inTok"></div>
        <p class="hint" id="h-inTok" data-t="hInTok"></p>
        <div class="field"><label for="f-outTok" data-t="outTok"></label><input id="f-outTok" type="number" data-field="outTok" aria-describedby="h-outTok"></div>
        <p class="hint" id="h-outTok" data-t="hOutTok"></p>
        <div class="field"><span class="field-label" id="docLangLabel" data-t="docLang"></span>
          <div class="edu-seg" role="group" aria-labelledby="docLangLabel" data-field="docLang">
            <button type="button" data-value="pl" data-t="docPl"></button>
            <button type="button" data-value="en" data-t="docEn"></button>
          </div>
        </div>
      </section>

      <section class="settings-group">
        <h3 class="group-title" data-t="groupApi"></h3>
        <div class="field"><label for="f-model" data-t="model"></label><select id="f-model" data-field="model" aria-describedby="h-model"></select></div>
        <p class="hint" id="h-model" data-t="hModel"></p>
        <div class="field"><label for="f-uiOps" data-t="uiOps"></label><input id="f-uiOps" type="number" data-field="uiOps"></div>
        <p class="hint" data-t="uiOpsHint"></p>
        <div class="field"><label for="f-fx" data-t="fx"></label><input id="f-fx" type="number" data-field="fx"></div>
      </section>

      <section class="settings-group">
        <h3 class="group-title" data-t="groupLocal"></h3>
        <div class="field"><label for="f-localCapex" data-t="localCapex"></label><input id="f-localCapex" type="number" data-field="localCapex" aria-describedby="h-localCapex"></div>
        <p class="hint" id="h-localCapex" data-t="hLocalCapex"></p>
        <div class="field"><label for="f-localAmort" data-t="localAmort"></label><input id="f-localAmort" type="number" data-field="localAmort" aria-describedby="h-localAmort"></div>
        <p class="hint" id="h-localAmort" data-t="hLocalAmort"></p>
        <div class="field"><label for="f-localPower" data-t="localPower"></label><input id="f-localPower" type="number" data-field="localPower" aria-describedby="h-localPower"></div>
        <p class="hint" id="h-localPower" data-t="hLocalPower"></p>
        <div class="field"><label for="f-kwh" data-t="kwh"></label><input id="f-kwh" type="number" data-field="kwh"></div>
        <div class="field"><label for="f-localOps" data-t="localOps"></label><input id="f-localOps" type="number" data-field="localOps" aria-describedby="h-localOps"></div>
        <p class="hint" id="h-localOps" data-t="hLocalOps"></p>
        <div class="field"><label for="f-localMaxUsers" data-t="localMaxUsers"></label><input id="f-localMaxUsers" type="number" data-field="localMaxUsers" aria-describedby="h-localMaxUsers"></div>
        <p class="hint" id="h-localMaxUsers" data-t="hLocalMaxUsers"></p>
      </section>
    </div>
  </aside>

  <div id="resultsPanel" tabindex="-1">
    <div class="page-head">
      <h1 class="app-title" data-t="seatsPageTitle"></h1>
      <p class="edu-lead" data-t="seatsLead"></p>
    </div>
    <p class="invalid-note" data-t="invalidNote"></p>
    <div data-results>
      <p class="verdict" id="verdict" aria-live="polite"></p>
      <div id="seatCards" class="seat-cards"></div>
      <section class="card seat-bars" data-accent="seats" aria-labelledby="barsTitle">
        <h2 class="chart-title" id="barsTitle" data-t="barsTitle"></h2>
        <div id="seatBars" role="img" data-t-aria="barsAria"></div>
      </section>
    </div>
    <section id="optionsExplained" aria-labelledby="optionsTitle">
      <h2 class="sec-title options-title" id="optionsTitle" data-t="optionsTitle"></h2>
      <div class="option-cards">
        <article class="card option-card">
          <h3 class="sec-title" data-t="optSub"></h3>
          <dl class="option-facts">
            <dt data-t="optWhat"></dt><dd data-t="optSubWhat"></dd>
            <dt data-t="optPay"></dt><dd data-t="optSubPay"></dd>
            <dt data-t="optCare"></dt><dd data-t="optSubCare"></dd>
            <dt data-t="optWhen"></dt><dd data-t="optSubWhen"></dd>
          </dl>
        </article>
        <article class="card option-card">
          <h3 class="sec-title" data-t="optApi"></h3>
          <dl class="option-facts">
            <dt data-t="optWhat"></dt><dd data-t="optApiWhat"></dd>
            <dt data-t="optPay"></dt><dd data-t="optApiPay"></dd>
            <dt data-t="optCare"></dt><dd data-t="optApiCare"></dd>
            <dt data-t="optWhen"></dt><dd data-t="optApiWhen"></dd>
          </dl>
        </article>
        <article class="card option-card">
          <h3 class="sec-title" data-t="optLocal"></h3>
          <dl class="option-facts">
            <dt data-t="optWhat"></dt><dd data-t="optLocalWhat"></dd>
            <dt data-t="optPay"></dt><dd data-t="optLocalPay"></dd>
            <dt data-t="optCare"></dt><dd data-t="optLocalCare"></dd>
            <dt data-t="optWhen"></dt><dd data-t="optLocalWhen"></dd>
          </dl>
        </article>
      </div>
    </section>
    <p class="hint" data-t="estimateNote"></p>
    <details class="panel" id="checksPanel" hidden></details>
    <footer class="shortcuts" data-t="shortcuts"></footer>
    <div class="sr-only" aria-live="polite" id="live"></div>
  </div>
</main>

<script src="sub/core.js"></script>
<script src="sub/ui.js"></script>
<script src="sub/seats.js"></script>
</body>
</html>
