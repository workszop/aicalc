<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
<title data-t="agentPageTitle">Agent / automatyzacja – koszt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Roboto+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="sub/sub.css">
<link rel="stylesheet" href="sub/prices.css">
</head>
<body class="edu" data-page="agent" data-state="loading">
<header class="edu-header"></header>

<main id="app" data-settings="closed">
  <button type="button" id="settingsBackdrop" tabindex="-1" data-t-aria="closeSettings" hidden></button>
  <aside id="settingsPanel" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle" data-t="settingsTitle"></h2>
      <button type="button" class="ghost-btn" id="settingsClose" data-t="settingsDone"></button>
    </div>
    <div class="settings-body">
      <section class="settings-group" data-accent="agent">
        <h3 class="group-title" data-t="groupProcess"></h3>
        <div class="edu-seg preset-seg" role="group" data-t-aria="agentPresetsLabel" id="presets">
          <button type="button" data-preset="mail" data-t="presetMail"></button>
          <button type="button" data-preset="report" data-t="presetReport"></button>
          <button type="button" data-preset="invoice" data-t="presetInvoice"></button>
        </div>
        <p class="hint" data-t="presetsHint"></p>
        <div class="field"><label for="f-runs" data-t="runs"></label><input id="f-runs" type="number" data-field="runs"></div>
      </section>

      <section class="settings-group">
        <h3 class="group-title" data-t="groupAgent"></h3>
        <div class="field"><label for="f-model" data-t="model"></label><select id="f-model" data-field="model"></select></div>
        <div class="field"><label for="f-steps" data-t="steps"></label><input id="f-steps" type="number" data-field="steps"></div>
        <div class="field"><span class="field-label" id="contextModeLabel" data-t="contextMode"></span>
          <div class="edu-seg" role="group" aria-labelledby="contextModeLabel" aria-describedby="contextModeHint" data-field="contextMode">
            <button type="button" data-value="growing" data-t="ctxGrowing"></button>
            <button type="button" data-value="flat" data-t="ctxFlat"></button>
          </div>
        </div>
        <p class="hint" id="contextModeHint" data-t="contextModeHint"></p>
        <div class="field"><label for="f-inTok" data-t="agentInTok"></label><input id="f-inTok" type="number" data-field="inTok"></div>
        <div class="field"><label for="f-outTok" data-t="agentOutTok"></label><input id="f-outTok" type="number" data-field="outTok"></div>
        <div id="toolOutTokField">
        <div class="field"><label for="f-toolOutTok" data-t="toolOutTok"></label><input id="f-toolOutTok" type="number" data-field="toolOutTok"></div>
        </div>
        <div class="field"><label for="f-retryPct" data-t="retryPct"></label><input id="f-retryPct" type="number" data-field="retryPct"></div>
        <div class="field"><span class="field-label" id="docLangLabel" data-t="agentDocLang"></span>
          <div class="edu-seg" role="group" aria-labelledby="docLangLabel" data-field="docLang">
            <button type="button" data-value="pl" data-t="docPl"></button>
            <button type="button" data-value="en" data-t="docEn"></button>
          </div>
        </div>
      </section>

      <section class="settings-group">
        <h3 class="group-title" data-t="groupTools"></h3>
        <div class="field"><label for="f-toolPln" data-t="toolPln"></label><input id="f-toolPln" type="number" data-field="toolPln"></div>
        <div class="field"><label for="f-platform" data-t="platform"></label><input id="f-platform" type="number" data-field="platform"></div>
        <div class="field"><label for="f-budget" data-t="budget"></label><input id="f-budget" type="number" data-field="budget"></div>
        <div class="field"><label for="f-fx" data-t="fx"></label><input id="f-fx" type="number" data-field="fx"></div>
      </section>
    </div>
  </aside>

  <div id="resultsPanel" tabindex="-1">
    <div class="page-head">
      <h1 class="app-title" data-t="agentPageTitle"></h1>
      <p class="edu-lead" data-t="agentLead"></p>
    </div>
    <p class="invalid-note" data-t="invalidNote"></p>
    <div data-results>
      <article id="agentCard" class="card agent-card" data-accent="agent" aria-live="polite"></article>
      <section class="card detail-card" id="costBreakdown" aria-labelledby="breakdownTitle">
        <h2 class="sec-title" id="breakdownTitle" data-t="breakdownTitle"></h2>
        <div id="breakdownBody"></div>
      </section>
    </div>
    <section class="card" id="agentSteps" data-accent="agent" aria-labelledby="agentStepsTitle">
      <h2 class="sec-title" id="agentStepsTitle" data-t="agentStepsTitle"></h2>
      <ol class="steps-list">
        <li data-t="agentStep1"></li>
        <li data-t="agentStep2"></li>
        <li data-t="agentStep3"></li>
        <li data-t="agentStep4"></li>
        <li data-t="agentStep5"></li>
      </ol>
      <p class="hint" data-t="agentStepsNote"></p>
    </section>
    <section class="card detail-card" id="stepSection" data-results aria-labelledby="stepTitle">
      <h2 class="sec-title" id="stepTitle" data-t="stepTitle"></h2>
      <p class="hint" id="stepCaption" data-t="stepCaption"></p>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="stepTitle"><table class="data-tbl" id="stepTable"></table></div>
    </section>
    <section class="card detail-card" id="modelSection" data-results aria-labelledby="modelTitle">
      <h2 class="sec-title" id="modelTitle" data-t="modelTitle"></h2>
      <div class="table-wrap" id="modelTableWrap" tabindex="0" role="region" aria-labelledby="modelTitle"><table class="data-tbl" id="modelTable"></table></div>
    </section>
    <section class="card detail-card" id="scaleSection" data-results aria-labelledby="scaleTitle">
      <h2 class="sec-title" id="scaleTitle" data-t="scaleTitle"></h2>
      <div class="table-wrap" tabindex="0" role="region" aria-labelledby="scaleTitle"><table class="data-tbl" id="scaleTable"></table></div>
      <p class="hint" data-t="scaleNote"></p>
    </section>
    <p class="hint" data-t="estimateNote"></p>
    <details class="panel" id="checksPanel" hidden></details>
    <footer class="shortcuts" data-t="shortcuts"></footer>
    <div class="sr-only" aria-live="polite" id="live"></div>
  </div>
</main>

<script src="sub/core.js"></script>
<script src="sub/ui.js"></script>
<script src="sub/prices.js"></script>
<script src="sub/prices-ui.js"></script>
<script src="sub/agent.js"></script>
</body>
</html>
